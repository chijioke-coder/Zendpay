{% extends "base.html" %}

{% block body %}

<span class="grow"></span><button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">🌓</button></header>
<nav class="onav">
  <a href="{{ url_for('owner_home') }}" class="{{ 'on' if onav=='home' }}">Overview</a>

<main class="odash">{% include "_flash.html" %}{% block content %}{% endblock %}</main>
{% endblock %}
