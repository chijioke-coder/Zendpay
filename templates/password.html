{% extends "user_base.html" %}
{% block header %}{% set back=url_for('settings') %}{% set title='Login Settings' %}{% include "_back.html" %}{% endblock %}
{% block content %}
<form method="post" class="card stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="field pw"><input type="password" name="current" placeholder="Current password" required><button type="button" class="eye" data-eye>👁</button></label>
  <label class="field pw"><input type="password" name="new" placeholder="New password" required><button type="button" class="eye" data-eye>👁</button></label>
  <label class="field pw"><input type="password" name="confirm" placeholder="Confirm new password" required><button type="button" class="eye" data-eye>👁</button></label>
  <button class="btn primary">Update password</button></form>
{% endblock %}
